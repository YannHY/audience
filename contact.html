<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Audience</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/icones/favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icones/favicon-16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icones/apple-touch-icon.png?v=2">
    <script>
        try {
            const savedTheme = localStorage.getItem('audience-theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('theme-dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.add('theme-light');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('theme-dark');
            }
        } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css?v=20261122d">
</head>
<body>
    <div id="accountBar" class="account-bar"></div>

    <div class="brand-title">
        <a href="index.html" aria-label="Retour à l'accueil Audience">
            <img class="brand-title-logo" src="img/logo/logo.png" alt="Logo Audience">
        </a>
        <h1>Audience</h1>
    </div>
    <p class="site-tagline">Créez vos questions et affichez les réponses en direct</p>

    <main class="legal-page contact-page">
        <h1><i class="fa-solid fa-envelope" aria-hidden="true"></i> Contact</h1>
        <form id="contactForm" class="contact-form" novalidate>
            <p class="contact-help">Envoyez votre message.<br>Si celui-ci sollicite un accès à Audience, merci de justifier brièvement votre demande (votre intérêt, vos usages, le public auquel vous le destinez).</p>

            <label for="contactName">Nom</label>
            <input id="contactName" name="name" type="text" autocomplete="name" required>

            <label for="contactEmail">Email</label>
            <input id="contactEmail" name="email" type="email" autocomplete="email" required>

            <label for="contactSubject">Sujet</label>
            <input id="contactSubject" name="subject" type="text" required>

            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" rows="7" required></textarea>

            <button type="submit" class="btn-contact-submit">
                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                Envoyer
            </button>

            <p id="contactStatus" class="contact-status" role="status" aria-live="polite"></p>
        </form>
    </main>

    <footer class="footer" data-site-footer></footer>

    <script src="site-nav.js?v=20261121v"></script>
    <script src="site-footer.js?v=20261121b"></script>
    <script src="theme.js?v=20261122a"></script>
    <script>
        const yearEl = document.getElementById('current-year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        const contactForm = document.getElementById('contactForm');
        const statusEl = document.getElementById('contactStatus');

        function showContactSuccess(el) {
            el.className = 'contact-status is-success';
            el.innerHTML = `
                <span class="contact-success-badge" aria-hidden="true">
                    <svg viewBox="0 0 52 52">
                        <circle class="contact-success-circle" cx="26" cy="26" r="24"></circle>
                        <path class="contact-success-check" d="M15 27 l7 7 l15 -16"></path>
                    </svg>
                </span>
                <span class="contact-success-title">Message envoyé&nbsp;!</span>
                <span class="contact-success-text">Il est bien arrivé à destination. Un email de confirmation vous attend dans votre boîte de réception.</span>
                <span class="contact-confetti" aria-hidden="true"></span>`;

            const confetti = el.querySelector('.contact-confetti');
            const colors = ['#10b981', '#34d399', '#6ee7b7'];
            const count = 14;
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('i');
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
                const distance = 60 + Math.random() * 50;
                piece.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                piece.style.setProperty('--dy', `${Math.sin(angle) * distance * 0.8 - 20}px`);
                piece.style.setProperty('--delay', `${750 + Math.round(Math.random() * 100)}ms`);
                piece.style.background = colors[i % colors.length];
                confetti.appendChild(piece);
            }
        }

        if (contactForm && statusEl) {
            contactForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                let isSent = false;
                if (!contactForm.checkValidity()) {
                    statusEl.textContent = 'Merci de compléter tous les champs obligatoires.';
                    statusEl.className = 'contact-status is-error';
                    contactForm.reportValidity();
                    return;
                }

                const submitBtn = contactForm.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                }
                statusEl.textContent = 'Envoi en cours...';
                statusEl.className = 'contact-status';

                const payload = {
                    name: (document.getElementById('contactName')?.value || '').trim(),
                    email: (document.getElementById('contactEmail')?.value || '').trim(),
                    subject: (document.getElementById('contactSubject')?.value || '').trim(),
                    message: (document.getElementById('contactMessage')?.value || '').trim()
                };

                try {
                    const response = await fetch('contact_send.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (!response.ok || !data || !data.success) {
                        throw new Error((data && data.error) ? data.error : 'Erreur lors de l’envoi');
                    }

                    showContactSuccess(statusEl);
                    contactForm.classList.add('is-complete');
                    contactForm.reset();
                    isSent = true;
                } catch (error) {
                    statusEl.textContent = error instanceof Error ? error.message : 'Erreur lors de l’envoi.';
                    statusEl.className = 'contact-status is-error';
                } finally {
                    if (submitBtn && !isSent) {
                        submitBtn.disabled = false;
                    }
                }
            });
        }
    </script>
</body>
</html>
